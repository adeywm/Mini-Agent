[project]
name = "minic-agent"
version = "0.1.0"
description = "Personal chat assistant for GitHub and AWS, with approval before risky actions"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain>=1.4.9",
    "langchain-aws>=0.2",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langgraph>=0.3",
    "langgraph-checkpoint-sqlite>=2",
    "mcp>=1.9",
    "mcp-proxy-for-aws>=1.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
