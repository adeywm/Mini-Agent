# Example operator configuration. Copy to config/agent.toml (git-ignored) and edit.
# Every account, region, cluster and repository the agent may touch must be listed here.
# 111122223333 is the AWS documentation example account ID - replace it.

[model]
provider = "bedrock"
# A Bedrock model or inference-profile ID enabled in your account, e.g. an Anthropic Claude
# inference profile. Check `aws bedrock list-inference-profiles` in model.region.
model_id = "SET_ME_BEDROCK_MODEL_OR_INFERENCE_PROFILE_ID"
region = "us-east-1"
temperature = 0.0
max_tokens = 2000

[aws_mcp]
# Endpoint region is where the managed MCP server runs, NOT where your resources are.
endpoint = "https://aws-mcp.us-east-1.api.aws/mcp"
endpoint_region = "us-east-1"

[[accounts]]
alias = "dev"
account_id = "111122223333"
environment = "development"
profile = "infra-agent-readonly-dev"   # read-only AWS CLI / SSO profile
allowed_regions = ["ap-south-1"]
allowed_clusters = ["dev-cluster"]          # ECS playbook scope only
require_mutation_denial_proof = true
permission_level = 1                         # 1 READ, 2 CREATE/UPDATE, 3 DELETE
writes_enabled = false                       # broker writes to this account
# execution_profile = "infra-agent-exec-dev" # separate permission-bounded role (InfraAgentExecution)

[[repositories]]
full_name = "example-org/backend"
account_alias = "dev"

[limits]
max_services = 20
max_stopped_tasks_per_service = 10
max_service_events = 10
max_agent_steps = 12
github_window_hours = 24

[budgets]
max_estimated_new_monthly_usd = 0

[execution]
# A write needs ALL of: this flag, env INFRA_AGENT_ENABLE_AWS_WRITES=true, the account's
# writes_enabled, the account's permission_level, policy, and (if required) human approval.
aws_writes_enabled = false
github_writes_enabled = false
approval_ttl_minutes = 60
max_operations_per_plan = 20

# Policy rules (first DENY wins, then first match). Defaults: READ auto, WRITE/DELETE approval.
# Built-in prohibitions (audit disabling, IAM escalation, key/backup destruction, ...) can't
# be overridden.
[[policy.rules]]
id = "dev-ecs-redeploy-auto"
effect = "ALLOW_AUTO"
account_alias = "dev"
service = "ecs"
operation = "UpdateService"

[github]
api_url = "https://api.github.com"
# app_id = 123456
# installation_id = 7890123
# private_key_path = "/run/secrets/github-app.pem"   # outside the repository

# API users: generate with `infra-agent hash-token`; store only the sha256 here.
# [[api.users]]
# name = "alice"
# roles = ["approver"]
# token_sha256 = "<64 hex chars>"

# Event triggers: verified events start tasks with operator-defined intents.
[[triggers]]
id = "failed-workflow"
source = "github"
event = "workflow_run"
match = { "action" = "completed", "workflow_run.conclusion" = "failure" }
account_alias = "dev"
intent = "Investigate the failed GitHub Actions run and propose a fix as a pull request."

[[triggers]]
id = "cloudwatch-alarm"
source = "aws"
event = "CloudWatch Alarm State Change"
match = { "detail.state.value" = "ALARM" }
account_alias = "dev"
intent = "Investigate the alarm, find the cause and propose the minimal remediation."
