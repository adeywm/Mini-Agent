# Placeholder-only sample, not deployable as-is.
schema_version: 1
accounts:
  - alias: sandbox
    account_id: SET_AWS_ACCOUNT_ID
    environment: development
    allowed_regions:
      - ap-south-1
    discovery_role: SET_READONLY_ROLE_ARN
    execution_roles:
      ecs_redeploy: SET_SCOPED_ROLE_ARN
repositories:
  - alias: backend
    owner: SET_GITHUB_OWNER
    name: SET_GITHUB_REPO
    installation_id: SET_INSTALLATION_ID
    protected_branches:
      - main
writes_enabled: false
