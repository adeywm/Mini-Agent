[project]
name = "infra-agent"
version = "0.1.0"
description = "Policy-enforced GitHub + AWS infrastructure agent (Phase 1: read-only ECS investigation)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "langchain>=1.4.9",
    "langchain-aws>=0.2",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langgraph>=0.3",
    "mcp>=1.9",
    "mcp-proxy-for-aws>=1.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[project.scripts]
infra-agent = "infra_agent.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infra_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["infra_agent"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "mcp_proxy_for_aws.*", "langchain_mcp_adapters.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
